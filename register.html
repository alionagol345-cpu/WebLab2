<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - Будильник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header class="bg-primary text-white text-center py-3 shadow-sm">
        <h1>Мій Будильник</h1>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mt-3">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Головна</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">Про додаток</a></li>
                        <li class="nav-item"><a class="nav-link" href="profile.html">Профіль користувача</a></li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="login.html">Вхід</a></li>
                        <li class="nav-item"><a class="nav-link active" href="register.html">Реєстрація</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm border-0 w-100" style="max-width: 500px;" id="app">
            <div class="card-header bg-white py-3 text-center">
                <h2 class="h4 mb-0 text-primary">Створити акаунт</h2>
            </div>
            <div class="card-body p-4">
                
                <div v-if="errorMessage" class="alert alert-danger" role="alert">
                    {{ errorMessage }}
                </div>

                <form @submit.prevent="registerUser">
                    <div class="mb-3">
                        <label for="regName" class="form-label">Ім'я</label>
                        <input type="text" class="form-control" id="regName" v-model="user.name" placeholder="Введіть ваше ім'я" required>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Електронна пошта (Email)</label>
                        <input type="email" class="form-control" id="regEmail" v-model="user.email" placeholder="name@example.com" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="regGender" class="form-label">Стать</label>
                            <select class="form-select" id="regGender" v-model="user.gender" required>
                                <option value="" selected disabled>Оберіть...</option>
                                <option value="female">Жіноча</option>
                                <option value="male">Чоловіча</option>
                                <option value="other">Інше</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="regDob" class="form-label">Дата народження</label>
                            <input type="date" class="form-control" id="regDob" v-model="user.dob" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="regPassword" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="regPassword" v-model="user.password" placeholder="Створіть надійний пароль" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Зареєструватись</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Вже маєте акаунт? <a href="login.html" class="text-decoration-none">Увійдіть</a></small>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 Терещенко Альона. Лабораторна робота №3.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    // Дані користувача, які зв'язані з полями через v-model
                    user: {
                        name: '',
                        email: '',
                        gender: '',
                        dob: '',
                        password: ''
                    },
                    errorMessage: '' // Сюди будемо записувати помилки від сервера
                }
            },
            methods: {
                async registerUser() {
                    this.errorMessage = '';
                    try {
                        // Відправка асинхронного POST-запиту на сервер за допомогою Axios
                        const response = await axios.post('/api/register', this.user);
                        
                        if (response.data.success) {
                            alert('Реєстрація успішна! Тепер ви можете увійти.');
                            window.location.href = 'login.html'; // Перенаправлення на сторінку входу
                        }
                    } catch (error) {
                        // Обробка помилок (наприклад, якщо такий email вже є в БД)
                        this.errorMessage = error.response?.data?.error || 'Сталася помилка при реєстрації.';
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
