<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Будильник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header class="bg-primary text-white text-center py-3 shadow-sm">
        <h1>Мій Будильник</h1>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mt-3">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Головна</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">Про додаток</a></li>
                        <li class="nav-item"><a class="nav-link" href="profile.html">Профіль користувача</a></li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="login.html">Вхід</a></li>
                        <li class="nav-item"><a class="nav-link" href="register.html">Реєстрація</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm border-0 w-100" style="max-width: 400px;" id="app">
            <div class="card-header bg-white py-3 text-center">
                <h2 class="h4 mb-0 text-primary">Вхід до системи</h2>
            </div>
            <div class="card-body p-4">
                
                <div v-if="errorMessage" class="alert alert-danger" role="alert">
                    {{ errorMessage }}
                </div>

                <form @submit.prevent="loginUser">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Електронна пошта (Email)</label>
                        <input type="email" class="form-control" id="loginEmail" v-model="credentials.email" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label for="loginPassword" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="loginPassword" v-model="credentials.password" placeholder="Введіть пароль" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Увійти</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Ще не маєте акаунту? <a href="register.html" class="text-decoration-none">Зареєструйтесь</a></small>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 Терещенко Альона. Лабораторна робота №3.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    // Дані для авторизації, пов'язані з input через v-model
                    credentials: {
                        email: '',
                        password: ''
                    },
                    errorMessage: '' // Сюди запишемо текст помилки, якщо дані невірні
                }
            },
            methods: {
                async loginUser() {
                    this.errorMessage = '';
                    try {
                        // Відправляємо запит на сервер для перевірки пошти та пароля
                        const response = await axios.post('/api/login', this.credentials);
                        
                        if (response.data.success) {
                            // Зберігаємо дані користувача в localStorage, щоб використовувати їх на сторінці профілю
                            localStorage.setItem('currentUser', JSON.stringify(response.data.user));
                            
                            // Переходимо на головну сторінку
                            window.location.href = 'index.html';
                        }
                    } catch (error) {
                        // Обробка помилки 401 (невірні дані) або інших проблем з сервером
                        this.errorMessage = error.response?.data?.error || 'Невірний email або пароль.';
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
