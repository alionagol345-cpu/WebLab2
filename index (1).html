<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будильник - Головна сторінка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header class="bg-primary text-white text-center py-3 shadow-sm">
        <h1>Мій Будильник</h1>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mt-3">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="index.html">Головна</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">Про додаток</a></li>
                        <li class="nav-item"><a class="nav-link" href="profile.html">Профіль користувача</a></li>
                    </ul>
                    <ul class="navbar-nav ms-auto" v-if="user">
                        <li class="nav-item"><span class="nav-link disabled text-light">Привіт, {{ user.name }}!</span></li>
                        <li class="nav-item"><a class="nav-link" href="#" @click.prevent="logout">Вихід</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1" id="app">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card mb-4 shadow-sm border-0">
                    <div class="card-header bg-success text-white">
                        <h2 class="h5 mb-0 text-center">Додати новий будильник</h2>
                    </div>
                    <div class="card-body">
                        <form @submit.prevent="addAlarm">
                            <div class="row mb-3">
                                <div class="col"><label class="form-label">Дата</label><input type="date" class="form-control" v-model="newAlarm.date" required></div>
                                <div class="col"><label class="form-label">Час</label><input type="time" class="form-control" v-model="newAlarm.time" required></div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Зберегти будильник</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-secondary text-white">
                        <h2 class="h5 mb-0 text-center">Ваші заведені будильники</h2>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li v-if="alarms.length === 0" class="list-group-item text-center py-4 text-muted">Список порожній.</li>
                        
                        <li v-for="alarm in alarms" :key="alarm.id" class="list-group-item py-3">
                            <div v-if="editingId !== alarm.id" class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong :class="['fs-3', alarm.active ? 'text-primary' : 'text-muted']">{{ alarm.time }}</strong>
                                    <span class="text-muted ms-2 d-block d-sm-inline">{{ formatDate(alarm.date) }}</span>
                                </div>
                                <div class="d-flex align-items-center">
                                    <div class="form-check form-switch fs-5 me-3">
                                        <input class="form-check-input" type="checkbox" :checked="alarm.active" @change="toggleAlarm(alarm)">
                                    </div>
                                    <button class="btn btn-sm btn-outline-primary me-2" @click="startEdit(alarm)">✎</button>
                                    <button class="btn btn-sm btn-outline-danger" @click="deleteAlarm(alarm.id)">×</button>
                                </div>
                            </div>

                            <div v-else class="row g-2 align-items-end">
                                <div class="col"><input type="date" class="form-control form-control-sm" v-model="editBuffer.date"></div>
                                <div class="col"><input type="time" class="form-control form-control-sm" v-model="editBuffer.time"></div>
                                <div class="col-auto">
                                    <button class="btn btn-sm btn-success me-1" @click="saveEdit(alarm)">✓</button>
                                    <button class="btn btn-sm btn-secondary" @click="editingId = null">✕</button>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container"><p class="mb-0">© 2026 Терещенко Альона. Лабораторна робота №3.</p></div>
    </footer>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    user: null,
                    alarms: [],
                    newAlarm: { date: '', time: '' },
                    editingId: null,
                    editBuffer: { date: '', time: '' }
                }
            },
            mounted() {
                const savedUser = localStorage.getItem('currentUser');
                if (savedUser) {
                    this.user = JSON.parse(savedUser);
                    this.fetchAlarms();
                    // Запуск перевірки будильників кожну секунду
                    setInterval(this.checkAlarms, 1000);
                } else {
                    window.location.href = 'login.html';
                }
            },
            methods: {
                async fetchAlarms() {
                    const res = await axios.get(`/api/alarms?userId=${this.user.id}`);
                    this.alarms = res.data;
                },
                async addAlarm() {
                    const res = await axios.post('/api/alarms', { ...this.newAlarm, userId: this.user.id });
                    this.alarms.push(res.data);
                    this.newAlarm = { date: '', time: '' };
                },
                startEdit(alarm) {
                    this.editingId = alarm.id;
                    this.editBuffer = { date: alarm.date, time: alarm.time };
                },
                async saveEdit(alarm) {
                    await axios.put(`/api/alarms/${alarm.id}`, this.editBuffer);
                    alarm.date = this.editBuffer.date;
                    alarm.time = this.editBuffer.time;
                    this.editingId = null;
                },
                async toggleAlarm(alarm) {
                    const newStatus = alarm.active ? 0 : 1;
                    await axios.patch(`/api/alarms/${alarm.id}`, { active: newStatus });
                    alarm.active = newStatus;
                },
                async deleteAlarm(id) {
                    if (confirm('Видалити?')) {
                        await axios.delete(`/api/alarms/${id}`);
                        this.alarms = this.alarms.filter(a => a.id !== id);
                    }
                },
                checkAlarms() {
                    const now = new Date();
                    const currentTime = now.toTimeString().substring(0, 5); // Формат "HH:mm"
                    const currentDate = now.toISOString().split('T')[0]; // Формат "YYYY-MM-DD"

                    this.alarms.forEach(alarm => {
                        if (alarm.active && alarm.time === currentTime && alarm.date === currentDate) {
                            // Видаємо повідомлення згідно з завданням 
                            alert(`⏰ УВАГА! Будильник на ${alarm.time} спрацював!`);
                            alarm.active = 0; // Вимикаємо після спрацювання
                            axios.patch(`/api/alarms/${alarm.id}`, { active: 0 });
                        }
                    });
                },
                formatDate(d) { return new Date(d).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' }); },
                logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }
            }
        }).mount('body');
    </script>
</body>
</html>
